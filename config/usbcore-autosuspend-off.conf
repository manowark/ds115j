# DS115j: keep USB storage awake (see docs/dsm-os-features.md)
# Installed by install-userspace.sh -> /etc/modprobe.d/usbcore-autosuspend-off.conf
# Kernel default usbcore.autosuspend=2 (2 s). On a NAS with always-attached
# USB disks/bridges, autosuspend can stall the first I/O. Disable it.
# Note: applies at modprobe/usbcore bind time — reboot required to take effect;
# current live session is set directly via /sys/module/usbcore/parameters/autosuspend.
options usbcore autosuspend=-1