# Network tuning for DS115j (Debian trixie armhf, Marvell Armada 370)
# BBR congestion control + larger TCP buffers for GbE

# --- TCP congestion control: BBR ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# --- TCP Fastopen (client + server) ---
net.ipv4.tcp_fastopen = 3

# --- TCP buffer sizes (min / default / max in bytes) ---
# Larger max allows GbE to sustain high throughput
net.ipv4.tcp_rmem = 4096 87380 1048576
net.ipv4.tcp_wmem = 4096 65536 1048576

# --- Socket buffer limits ---
net.core.rmem_max = 1048576
net.core.wmem_max = 1048576
net.core.rmem_default = 262144
net.core.wmem_default = 262144
