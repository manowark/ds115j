# DS115j single SATA disk: monitor SMART health, attributes, logs,
# temperature and scheduled tests. Run the amber LED hook directly;
# no mailer is configured on this LAN-only appliance.
#
# -n standby,q: skip the check (quietly) when the disk is already in
# standby so smartd does not spin it up. Poll interval is in
# /etc/default/smartmontools (--interval=3600).
/dev/sda -d sat -n standby,q -a -o on -S on -s (S/../.././02|L/../../6/03) -W 4,45,50 -m <nomailer> -M exec /usr/local/sbin/smart-amber-led.sh
