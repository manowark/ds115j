# DS115j: feed the SoC Orion watchdog (see docs/dsm-os-features.md)
# Installed by install-userspace.sh -> /etc/systemd/system.conf.d/90-ds115j-watchdog.conf
#
# The Armada 370 SoC watchdog (/dev/watchdog0, "Orion Watchdog", timeout 257 s)
# is present but NOTHING feeds it — a hard kernel hang leaves the NAS dead
# until a manual power-cycle. With RuntimeWatchdogSec set, systemd pings the
# watchdog every half-interval; if the kernel/systemd hang beyond the timeout,
# the SoC resets the board automatically. Standard NAS resilience behaviour.
#
# Read at systemd manager start -> effect after the next reboot.
# Revert: delete this file and reboot.

[Manager]
RuntimeWatchdogSec=60