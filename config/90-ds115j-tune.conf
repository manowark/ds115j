# DS115j kernel tuning — DSM parity (see docs/dsm-os-features.md)
# Installed by install-userspace.sh -> /etc/sysctl.d/90-ds115j-tune.conf
#
# net.core.somaxconn: DSM sets 65535 (default 4096). A file server with many
#   concurrent SMB/NFS clients benefits from the larger accept queue.
# net.ipv6.conf.default.accept_ra_defrtr: DSM sets 0 — never take a default
#   route from RA (we are static/DHCP on IPv4; IPv6 is router-SLAAC).
# kernel.panic stays 10 (already in bootargs), tcp_tw_reuse stays 2 (6.x
#   default is the safe-enable value; DSM's 1 is older).

net.core.somaxconn=65535
net.ipv6.conf.default.accept_ra_defrtr=0