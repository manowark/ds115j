# syno-powerbtn.conf — DS115j front power-button trigger configuration.
# Reads: /etc/syno-powerbtn.conf on the NAS (this file is the canonical copy in the repo).

# TRIGGER_BYTES: hex byte(s) the PIC16LF1828 sends when the FRONT POWER BUTTON is pressed.
#   Proven from the DSM scemd binary (event_microp.c) AND live on the box 2026-09-21:
#   the press byte is '0' = 0x30 (two independent presses logged "byte 0x30", then the
#   armed daemon powered the NAS off cleanly).
#   NAS state: ARMED with TRIGGER_BYTES="30" (clean poweroff via the front button works).
#   CAVEAT: button reporting requires the DSM rc boot bytes with newline first
#   (`echo 4 > /dev/ttyS1` + `echo 9 > /dev/ttyS1`, 0x34 0x0A / 0x39 0x0A). Whether this
#   arming survives a cold boot is UNTESTED — if the box is powered off and back on,
#   verify with one press before relying on it (and consider a boot unit that re-sends
#   the rc bytes; see docs/power-button.md).
#   Leave empty => OBSERVE MODE: the daemon logs every byte from the MCU and never powers off.
#   Multiple bytes are allowed: TRIGGER_BYTES="30 30"
TRIGGER_BYTES="30"

# OPEN_RW=1: hold /dev/ttyS1 as O_RDWR|O_NOCTTY|O_NONBLOCK (scemd's exact 0x902 open),
# so RTS/DTR are asserted exactly like DSM's scemd holds the port 24/7.
# NOTE 2026-09-21: this option is now KNOWN-IRRELEVANT — a live TIOCMGET on the box
# proved O_RDONLY vs O_RDWR open modes both report TIOCM=0x4146 (DTR+RTS+CD+DSR
# asserted). The read-only daemon already holds the modem lines exactly like scemd.
# Kept only for completeness; do NOT spend a press test on it.
# The daemon still NEVER WRITES a byte in this mode. Default 0 = O_RDONLY.
OPEN_RW=0

# Ignore triggers for the first N seconds after the daemon starts (boot-time MCU chatter).
SETTLE_SEC=60

# Minimum seconds between two poweroff triggers (debounce).
DEBOUNCE_SEC=30